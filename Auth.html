<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="light">
  <title>Đăng nhập TaskFlow</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1e293b;background:#f6f8fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#ecfdf5,#f8fafc 48%,#eff6ff)}
    main{width:min(410px,100%);padding:28px;background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 22px 65px rgba(15,23,42,.14);text-align:center}
    .logo{width:52px;height:52px;margin:0 auto 15px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#2dd4bf,#fbbf24);color:#053d3a;font-weight:900}
    h1{margin:0;font-size:21px;color:#0f172a}p{margin:8px 0 20px;color:#64748b;font-size:12px;line-height:1.6}.button{min-height:44px;display:flex;justify-content:center}
    .status{display:none;margin-top:15px;padding:10px 12px;border-radius:9px;font-size:11px;line-height:1.5;text-align:left}.status.show{display:block}.status.error{color:#991b1b;background:#fef2f2}.status.success{color:#065f46;background:#ecfdf5}
    small{display:block;margin-top:18px;padding-top:14px;border-top:1px solid #eef2f7;color:#94a3b8;font-size:9px;line-height:1.55}
  </style>
</head>
<body>
  <main>
    <div class="logo">TF</div>
    <h1>Đăng nhập TaskFlow</h1>
    <p>Chọn tài khoản Google. ID token sẽ được chuyển trực tiếp về TaskFlow để backend xác minh.</p>
    <div class="button" id="googleButton"></div>
    <div class="status" id="status" role="status"></div>
    <small>Trang này không lưu ID token, mật khẩu hoặc dữ liệu Google Sheet.</small>
  </main>

  <script>
    'use strict';
    const params=new URLSearchParams(location.search);
    const clientId=params.get('client_id')||'';
    const requestState=params.get('state')||'';
    const returnOrigin=params.get('return_origin')||'';

    function showStatus(message,type){const el=document.getElementById('status');el.textContent=message;el.className='status show '+(type||'error')}
    function validConfig(){
      if(!/^\d+-[A-Za-z0-9_-]+\.apps\.googleusercontent\.com$/.test(clientId))return 'OAuth Client ID không hợp lệ.';
      if(!/^[a-f0-9]{48}$/.test(requestState))return 'Mã trạng thái đăng nhập không hợp lệ.';
      try{const origin=new URL(returnOrigin);if(origin.origin!==returnOrigin||origin.protocol!=='https:')return 'Origin nhận kết quả không hợp lệ.'}catch(_error){return 'Origin nhận kết quả không hợp lệ.'}
      if(!window.opener)return 'Không tìm thấy cửa sổ TaskFlow đã mở trang đăng nhập này.';
      return '';
    }
    function initGoogle(){
      const error=validConfig();if(error)return showStatus(error,'error');
      if(!window.google||!google.accounts||!google.accounts.id)return showStatus('Không tải được Google Identity Services.','error');
      google.accounts.id.initialize({client_id:clientId,callback:handleCredential,auto_select:false,cancel_on_tap_outside:false,use_fedcm_for_button:false});
      google.accounts.id.renderButton(document.getElementById('googleButton'),{type:'standard',theme:'outline',size:'large',text:'signin_with',shape:'rectangular',width:300,locale:'vi'});
    }
    function handleCredential(response){
      if(!response||!response.credential)return showStatus('Google không trả về ID token. Vui lòng thử lại.','error');
      window.opener.postMessage({type:'TASKFLOW_GIS_CREDENTIAL',state:requestState,credential:response.credential},returnOrigin);
      showStatus('Đăng nhập thành công. Đang quay lại TaskFlow…','success');
      setTimeout(()=>window.close(),700);
    }
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer onload="initGoogle()"></script>
</body>
</html>
